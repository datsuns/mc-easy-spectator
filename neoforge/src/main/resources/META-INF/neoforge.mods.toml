modLoader="javafml"
loaderVersion="[4,)"
license="${mod_license}"
issueTrackerURL="${mod_sources}/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
iconFile="assets/${mod_id}/icon.png"
displayURL="${mod_homepage}"
authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
config="mc_easy_spectator.neoforge.mixins.json"

[[dependencies.mc_easy_spectator]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.mc_easy_spectator]]
    modId="minecraft"
    type="required"
    versionRange="[${minecraft_version},)"
    ordering="NONE"
    side="BOTH"
